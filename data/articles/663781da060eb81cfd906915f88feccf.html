<link href="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="https://rs2.huanqiucdn.cn/huanqiu/image/www/common/200.jpg" style="display:none;"><div id="config_page" style="display:none;">/csr-component/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="visibility:hidden;height:0; overflow:hidden;"><div id="csr_topheader_ad">7003383</div><div id="csr_bottomheaderl_ad">7005136</div><div id="csr_bottomheaderr_ad">7005137</div><!--<cs-control data-src="controls/csr_article_ad/csr_article_ad"></cs-control>--><article><textarea class="article-aid">4TZtjPTVGIx</textarea><textarea class="article-author"> </textarea><textarea class="article-host">yrd.huanqiu.com</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">Agent Memory Challenge 第二期全球开放报名</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-catnode">/e3pu6i31u</textarea><textarea class="article-content"><article><section data-type="rtext"><p>Agent Memory Leaderboard（AML）作为面向长期智能体记忆的开放评测平台，目前已开启第二期评测报名，邀请全球研究人员、开发者、开源团队、商业 AI 公司及个人开发者参与，共同评估 Agent Memory 系统的实际能力。</p><p>随着 AI Agent 从一次性交互走向更长期、更复杂的任务，持续保留并利用过往经验的重要性日益提升。但 Agent Memory 的评测仍面临挑战，不同系统往往采用不同的数据集、检索方法、Prompt 和评分方式，使得横向比较并不容易。</p><p>AML 提供了一个开放、可复现的统一评测框架，用于比较不同 Agent Memory 系统。参赛方提供标准化的 Add 和 Search API，AML 则负责后续的 Answer、Evaluation、结果审核及排行榜发布。评测结果将按照赛道、参赛组别、版本及评测周期分别呈现，为结果提供清晰的评测背景。</p><p><em data-scene="strong">第一期奠定势头，推动智能体记忆评测进入下一阶段</em></p><p>AML第一期吸引了全球AI与开发者社区的强烈关注，超过100支团队参与，数十个记忆系统完成了官方评测。AML官网累计访问量超过30万次，其Hugging Face Space在当期登上Spaces趋势榜榜首。</p>
              <adv-loader __attr__inner="7004636" __attr__style="width: auto;position: relative;float: left;border: 1px solid #ebebeb; padding: 20px;overflow: hidden;margin: 10px 30px 40px 0;"></adv-loader>
            <p>在此基础上，第二期进一步扩大了评测范围，覆盖更广泛的智能体记忆能力和真实应用场景。</p><p><em data-scene="strong">第二期扩展至三大评测赛道</em></p><p>第二期将 Agent Memory 评测扩展至 Textual Memory、Coding Memory 和 Multimodal Memory 三大赛道。</p><p>Textual Memory 主要评测系统处理长对话及跨会话历史的能力，包括事实信息、多跳关系、时间信息、个性化、规则遵循、治理及流式记忆等。Coding Memory 重点评估系统能否检索并复用历史工程经验，包括实现背景、调试经验、失败案例、测试及技术决策等。Multimodal Memory 则评测系统处理文本与图像记忆及相关证据的能力。</p><p>第二期设有 Open-source Methods 和 Commercial Products 两个独立组别，面向全球研究人员、开源团队、商业 AI 团队及个人开发者开放，且免费参与。</p><p>符合条件的开源团队将角逐超过15万元的总奖金，每个赛道的第一名将获得2万元奖金。</p><p>参赛申请及完整材料须于 2026年10月31日23:59（UTC+8）前提交；本期评测将于 11月4日23:59（UTC+8）停止，结果预计 11 月中旬公布。</p><p><em data-scene="strong">构建开放的 Agent Memory 评测层</em></p><p>随着 AI Agent 承担越来越长期的任务，一个重要问题正在从“Agent 能否访问更多上下文”，转向“Agent 能否真正有效利用过去的经验”。</p><p>AML 为这一新兴能力提供独立的评测层。参与者可以自主控制其记忆系统及检索基础设施，而 AML 则提供统一的下游评测与比较框架。</p><p>AML 邀请全球研究人员、开源开发者、商业 AI 团队及个人开发者参与第二期评测，共同推动 Agent Memory 评测标准和生态的发展。</p><p>声明：该文章系转载，旨在为读者提供更多新闻资讯。所涉内容不构成投资、消费建议，仅供读者参考。</p></section></article></textarea><textarea class="article-time">1791768620195</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：梁威</textarea><textarea class="article-source-name"><a href="https://caijing.chinadaily.com.cn/a/202610/10/WS6ac9d7bce4b09a165c78e957.html" >中国日报网</a></textarea><textarea class="article-ext-xtime">1791768684644</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="article-keyboarder">{"email":"liangwei@huanqiu.com","name":"梁威"}</textarea></article><xpeng id="7004636"></xpeng>
